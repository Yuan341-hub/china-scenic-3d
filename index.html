<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国景点3D展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background: #0a0a1a;
            width: 100vw;
            height: 100vh;
        }

        /* ========== 通用视图切换 ========== */
        .view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: opacity 0.5s ease; }
        .view-hidden { opacity: 0; pointer-events: none; }
        .view-visible { opacity: 1; pointer-events: auto; }

        /* ========== 地图视图 ========== */
        #map-view {
            display: flex;
            flex-direction: column;
            background: radial-gradient(ellipse at center bottom, #0d1b2a 0%, #060a14 100%);
        }
        #map-topbar {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(76, 201, 240, 0.1);
            z-index: 10;
            flex-shrink: 0;
        }
        #map-topbar h1 {
            font-size: 22px;
            font-weight: 500;
            color: #4cc9f0;
            letter-spacing: 4px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #map-topbar h1::before,
        #map-topbar h1::after {
            content: '';
            width: 30px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #4cc9f0);
        }
        #map-topbar h1::after {
            background: linear-gradient(90deg, #4cc9f0, transparent);
        }
        #map-container {
            flex: 1;
            position: relative;
        }
        #map-chart {
            width: 100%;
            height: 100%;
        }
        /* 地图底部操作提示 */
        #map-footer {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid rgba(76, 201, 240, 0.08);
            font-size: 12px;
            color: #4a5568;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        /* ========== 3D视图 ========== */
        #scene-view {
            display: flex;
        }
        /* 左侧面板（返回按钮） */
        #left-panel {
            width: 280px;
            background: linear-gradient(180deg, #0d1b2a 0%, #1b2838 100%);
            color: white;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(76, 201, 240, 0.15);
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }
        #left-panel .panel-header {
            padding: 28px 24px 20px;
            border-bottom: 1px solid rgba(76, 201, 240, 0.1);
        }
        #left-panel .panel-header h2 {
            font-size: 20px;
            font-weight: 500;
            color: #4cc9f0;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #left-panel .panel-header h2::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #4cc9f0, #7b61ff);
            border-radius: 2px;
        }
        #left-panel .panel-body {
            padding: 24px;
            flex: 1;
        }
        #back-btn, #model-toggle .toggle-btn, #bmy-variants .variant-btn {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(76, 201, 240, 0.25);
            background: rgba(22, 33, 62, 0.8);
            color: #4cc9f0;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }
        #back-btn:hover, #model-toggle .toggle-btn:hover, #bmy-variants .variant-btn:hover {
            border-color: #4cc9f0;
            background: rgba(76, 201, 240, 0.1);
            box-shadow: 0 0 20px rgba(76, 201, 240, 0.15);
        }
        #model-toggle, #bmy-variants {
            margin-top: 12px;
            flex-direction: column;
            gap: 10px;
        }
        #model-toggle .toggle-btn.active, #bmy-variants .variant-btn.active {
            border-color: #4cc9f0;
            background: rgba(76, 201, 240, 0.18);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(76, 201, 240, 0.2);
        }
        #left-panel .panel-footer {
            padding: 16px 24px;
            border-top: 1px solid rgba(76, 201, 240, 0.08);
            font-size: 11px;
            color: #4a5568;
            line-height: 1.6;
        }
        /* 中间画布 */
        #canvas-container {
            flex: 1;
            background: radial-gradient(ellipse at center, #12182b 0%, #0a0a1a 70%);
            position: relative;
        }
        #canvas-hint {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(13, 27, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(76, 201, 240, 0.15);
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 12px;
            color: #6b7b8d;
            z-index: 5;
            pointer-events: none;
        }
        #canvas-hint span { color: #4cc9f0; font-weight: 500; }
        /* 模型加载中提示 */
        #model-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 6;
            pointer-events: none;
        }
        #model-loading .mini-spinner {
            width: 32px; height: 32px;
            border: 3px solid rgba(76, 201, 240, 0.15);
            border-top-color: #4cc9f0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        #model-loading .mini-text { color: #4cc9f0; font-size: 13px; letter-spacing: 2px; }
        /* 右侧信息面板 */
        #right-panel {
            width: 320px;
            background: linear-gradient(180deg, #0d1b2a 0%, #1b2838 100%);
            color: white;
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(76, 201, 240, 0.15);
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }
        #right-panel .panel-header {
            padding: 28px 24px 20px;
            border-bottom: 1px solid rgba(76, 201, 240, 0.1);
        }
        #right-panel .panel-header h2 {
            font-size: 20px;
            font-weight: 500;
            color: #4cc9f0;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #right-panel .panel-header h2::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #7b61ff, #4cc9f0);
            border-radius: 2px;
        }
        #right-panel .panel-body {
            padding: 24px;
            flex: 1;
            overflow-y: auto;
        }
        /* 信息内容样式 */
        #info-content { line-height: 1.8; color: #b0bec5; font-size: 14px; }
        #info-content .spot-name { font-size: 22px; font-weight: 700; color: #ffffff; margin-bottom: 8px; letter-spacing: 1px; }
        #info-content .spot-province {
            display: inline-block;
            background: rgba(76, 201, 240, 0.12);
            border: 1px solid rgba(76, 201, 240, 0.25);
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 12px;
            color: #4cc9f0;
            margin-bottom: 16px;
        }
        #info-content .spot-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(76, 201, 240, 0.2), transparent);
            margin: 16px 0;
        }
        #info-content .spot-desc { font-size: 14px; line-height: 2; color: #90a4ae; }
        #info-content .pick-tag {
            display: inline-block;
            background: linear-gradient(135deg, rgba(123, 97, 255, 0.2), rgba(76, 201, 240, 0.2));
            border: 1px solid rgba(123, 97, 255, 0.3);
            border-radius: 4px;
            padding: 2px 10px;
            font-size: 11px;
            color: #b388ff;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        #info-content .model-missing {
            margin-top: 16px;
            padding: 12px 14px;
            border: 1px dashed rgba(255, 183, 77, 0.4);
            border-radius: 8px;
            background: rgba(255, 183, 77, 0.06);
            color: #ffb74d;
            font-size: 12px;
            line-height: 1.8;
        }
        #info-content .model-missing code {
            background: rgba(255, 183, 77, 0.12);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 11px;
        }
        #info-content .demo-tag {
            margin-top: 14px;
            padding: 10px 12px;
            background: rgba(76, 201, 240, 0.08);
            border: 1px solid rgba(76, 201, 240, 0.25);
            border-radius: 8px;
            color: #4cc9f0;
            font-size: 12px;
            line-height: 1.7;
        }
        /* 左侧景点名片 */
        #left-info { flex: 1; overflow-y: auto; padding: 0 24px 20px !important; }
        #left-info .card-name { font-size: 24px; font-weight: 700; color: #fff; letter-spacing: 2px; margin-bottom: 8px; }
        #left-info .card-pills { margin-bottom: 16px; }
        #left-info .card-pill {
            display: inline-block;
            background: rgba(76, 201, 240, 0.12);
            border: 1px solid rgba(76, 201, 240, 0.25);
            border-radius: 20px;
            padding: 3px 12px;
            font-size: 11px;
            color: #4cc9f0;
            margin: 0 6px 6px 0;
        }
        #left-info .card-pill.gold {
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(212, 175, 55, 0.3);
            color: #d4af37;
        }
        #left-info .card-divider {
            height: 1px;
            background: linear-gradient(90deg, rgba(76, 201, 240, 0.3), transparent);
            margin: 12px 0;
        }
        #left-info .info-row {
            display: flex;
            gap: 10px;
            padding: 7px 0;
            border-bottom: 1px dashed rgba(76, 201, 240, 0.08);
            font-size: 12.5px;
            line-height: 1.7;
        }
        #left-info .info-label {
            color: #4cc9f0;
            width: 60px;
            flex-shrink: 0;
            font-weight: 500;
        }
        #left-info .info-value { color: #b0bec5; flex: 1; }
        #left-info::-webkit-scrollbar { width: 4px; }
        #left-info::-webkit-scrollbar-thumb { background: rgba(76, 201, 240, 0.2); border-radius: 2px; }
        /* 右侧详情分区 */
        #info-content .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #4cc9f0;
            letter-spacing: 2px;
            margin: 20px 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #info-content .section-title::before {
            content: '';
            display: inline-block;
            width: 3px;
            height: 14px;
            background: linear-gradient(180deg, #4cc9f0, #7b61ff);
            border-radius: 2px;
        }
        #info-content .highlight-list { list-style: none; padding: 0; margin: 0; }
        #info-content .highlight-list li {
            position: relative;
            padding: 6px 0 6px 18px;
            font-size: 13px;
            line-height: 1.8;
            color: #90a4ae;
            border-bottom: 1px dashed rgba(76, 201, 240, 0.08);
        }
        #info-content .highlight-list li::before {
            content: '◆';
            position: absolute;
            left: 0;
            color: #7b61ff;
            font-size: 9px;
            top: 11px;
        }
        #info-content .culture-text {
            font-size: 13px;
            line-height: 2;
            color: #90a4ae;
            text-align: justify;
        }
        #info-content .placeholder-text {
            color: #4a5568;
            font-size: 13px;
            text-align: center;
            padding-top: 60px;
            line-height: 2;
        }
        #info-content .placeholder-text .icon { font-size: 40px; display: block; margin-bottom: 12px; opacity: 0.3; }
        /* 自定义滚动条 */
        #right-panel .panel-body::-webkit-scrollbar { width: 5px; }
        #right-panel .panel-body::-webkit-scrollbar-track { background: transparent; }
        #right-panel .panel-body::-webkit-scrollbar-thumb { background: rgba(76, 201, 240, 0.2); border-radius: 3px; }
        #right-panel .panel-body::-webkit-scrollbar-thumb:hover { background: rgba(76, 201, 240, 0.4); }

        /* ========== 加载遮罩 ========== */
        #loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(76, 201, 240, 0.15);
            border-top-color: #4cc9f0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #4cc9f0; margin-top: 16px; font-size: 14px; letter-spacing: 2px; }

        /* ========== 移动端适配 ========== */
        #mobile-bar { display: none; }
        @media (max-width: 900px) {
            #scene-view { flex-direction: column; }
            #left-panel, #right-panel {
                width: 100%;
                border: none;
                box-shadow: none;
            }
            #left-panel {
                order: 1;
                flex-shrink: 0;
            }
            #left-panel .panel-header { display: none; }
            #left-panel .panel-body { padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
            #left-panel .panel-footer { display: none; }
            #left-info { padding: 0 !important; display: flex !important; align-items: center; gap: 10px; flex: 1; }
            #left-info #left-spot-name { font-size: 16px !important; margin-bottom: 0 !important; }
            #back-btn { width: auto; padding: 8px 14px; font-size: 13px; }
            #canvas-container { order: 2; min-height: 40vh; }
            #right-panel { order: 3; flex: 1; min-height: 0; border-top: 1px solid rgba(76, 201, 240, 0.15); }
            #right-panel .panel-header { display: none; }
            #right-panel .panel-body { padding: 16px; }
            #canvas-hint { font-size: 11px; padding: 8px 12px; }
        }
    </style>
</head>
<body>
    <!-- 加载遮罩 -->
    <div id="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">加载地图数据...</div>
    </div>

    <!-- ========== 地图视图 ========== -->
    <div id="map-view" class="view view-hidden">
        <div id="map-topbar">
            <h1>中国景点 3D 探索</h1>
        </div>
        <div id="map-container">
            <div id="map-chart"></div>
        </div>
        <div id="map-footer">点击地图上的景点标记，进入 3D 模型浏览</div>
    </div>

    <!-- ========== 3D视图 ========== -->
    <div id="scene-view" class="view view-hidden">
        <div id="left-panel">
            <div class="panel-header">
                <h2>景点档案</h2>
            </div>
            <div class="panel-body">
                <button id="back-btn">&#8592; 返回地图</button>
                <div id="bmy-variants" style="display:none;">
                    <button class="variant-btn" id="btn-bmy-army">兵马俑军阵群像</button>
                    <button class="variant-btn" id="btn-bmy-kneeling">兵马俑跪射俑</button>
                </div>
                <div id="model-toggle" style="display:none;">
                    <button class="toggle-btn active" id="btn-schematic">原理模型</button>
                    <button class="toggle-btn" id="btn-realistic">真实模型</button>
                </div>
            </div>
            <div id="left-info" style="display:none;"></div>
            <div class="panel-footer">
                支持鼠标左键旋转 / 右键平移 / 滚轮缩放<br>
                点击模型可查看详细信息
            </div>
        </div>
        <div id="canvas-container">
            <div id="canvas-hint">
                <span>LMB</span> 旋转 &nbsp;&nbsp; <span>RMB</span> 平移 &nbsp;&nbsp; <span>Scroll</span> 缩放 &nbsp;&nbsp; <span>Click</span> 拾取
            </div>
            <div id="model-loading">
                <div class="mini-spinner"></div>
                <div class="mini-text">模型加载中...</div>
            </div>
        </div>
        <div id="right-panel">
            <div class="panel-header">
                <h2>详细介绍</h2>
            </div>
            <div class="panel-body">
                <div id="info-content">
                    <div class="placeholder-text">
                        <span class="icon">&#9670;</span>
                        从地图选择一个景点<br>开始探索之旅
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Libraries -->
    <script src="libs/echarts.min.js"></script>
    <script src="libs/three.min.js"></script>
    <script src="libs/GLTFLoader.js"></script>
    <script src="libs/OrbitControls.js"></script>
    <script>
    // Three.js 插件已本地化（libs/GLTFLoader.js / libs/OrbitControls.js）
    window.__threePluginsReady = true;
    </script>

    <script>
    // ==================== 景点数据 ====================
    const scenicData = {
        "北京": [
            { name: "故宫", province: "北京", description: "北京故宫是中国明清两代的皇家宫殿，旧称紫禁城，位于北京中轴线的中心。是中国古代宫廷建筑之精华，也是世界上现存规模最大、保存最为完整的木质结构古建筑之一。", model: "models/gugong.glb", coord: [116.40, 39.90] },
            { name: "长城", province: "北京", description: "长城是中国古代的军事防御工程，西起嘉峪关，东至鸭绿江。横跨中国北方的崇山峻岭，绵延万里，是世界七大奇迹之一。", model: "models/greatwall.glb", coord: [116.23, 40.31] }
        ],
        "西安": [
            { name: "兵马俑", province: "陕西西安", description: "秦始皇兵马俑是世界考古史上最伟大的发现之一，被誉为世界第八大奇迹。数千件栩栩如生的陶俑排列成阵，展现了秦朝的强大军事力量。", model: "models/bingmayong.glb", coord: [109.91, 34.38] },
            { name: "大雁塔", province: "陕西西安", description: "大雁塔位于西安市南的大慈恩寺内，是唐代高僧玄奘为保存佛经而建造的。塔高64米，共七层，是中国佛教建筑艺术的杰作。", model: "models/dayanta.glb", coord: [108.95, 34.22] }
        ],
        "杭州": [
            { name: "西湖", province: "浙江杭州", description: "西湖是中国著名的旅游景点，以其秀丽的湖光山色和众多的名胜古迹闻名中外。湖中有三潭印月、断桥残雪等著名景观。", model: "models/xihu.glb", coord: [120.15, 30.25] },
            { name: "灵隐寺", province: "浙江杭州", description: "灵隐寺是中国佛教禅宗十大古刹之一，位于杭州西湖西北面。始建于东晋咸和元年，距今已有近一千七百年的历史。", model: "models/lingyinsi.glb", coord: [120.10, 30.24] }
        ],
        "苏州": [
            { name: "拙政园", province: "江苏苏州", description: "拙政园是中国古典园林的代表作品，与北京颐和园、承德避暑山庄、苏州留园一起被誉为中国四大名园。以水为中心，山水萦绕，厅榭精美。", model: "models/zhuozhengyuan.glb", coord: [120.63, 31.32] }
        ],
        "成都": [
            { name: "都江堰", province: "四川成都", description: "都江堰是世界文化遗产，是全世界迄今为止，年代最久、唯一留存、以无坝引水为特征的宏大水利工程。由战国时期秦国蜀郡太守李冰父子修建。", model: "models/dujiangyan.glb", coord: [103.62, 31.00], builder: buildDujiangyan },
            { name: "武侯祠", province: "四川成都", description: "武侯祠是纪念中国三国时期蜀汉丞相诸葛亮的祠堂。它是全国唯一的君臣合祀祠庙，也是三国遗迹源头。", model: "models/wuhouci.glb", coord: [104.03, 30.64] }
        ],
        "拉萨": [
            { name: "布达拉宫", province: "西藏拉萨", description: "布达拉宫坐落于拉萨红山之巅，是世界上海拔最高、最雄伟的宫堡式建筑群。始建于公元7世纪松赞干布时期，依山垒砌、群楼重叠，是藏传佛教的圣地与西藏的象征。", model: "models/budalagong.glb", coord: [91.11, 29.66] }
        ],
        "敦煌": [
            { name: "莫高窟", province: "甘肃敦煌", description: "莫高窟坐落在河西走廊西端的鸣沙山东麓，始建于前秦建元二年。现存735个洞窟、4.5万平方米壁画，是世界上现存规模最大、内容最丰富的佛教艺术宝库。", model: "models/mogaoku.glb", coord: [94.81, 40.04] }
        ]
    };

    // 扁平化景点列表，方便查找
    const allSpots = Object.values(scenicData).flat();

    // 景点详细资料（门票/开放时间为公开信息参考值，以景区官方公告为准）

    // ==================== 视图切换 ====================
    let currentView = 'map'; // 'map' | 'scene'

    function switchView(target) {
        const mapView = document.getElementById('map-view');
        const sceneView = document.getElementById('scene-view');

        if (target === 'scene') {
            mapView.classList.replace('view-visible', 'view-hidden');
            sceneView.classList.replace('view-hidden', 'view-visible');
            currentView = 'scene';
            // 触发Three.js渲染器resize
            setTimeout(onWindowResize, 100);
        } else {
            sceneView.classList.replace('view-visible', 'view-hidden');
            mapView.classList.replace('view-hidden', 'view-visible');
            currentView = 'map';
            // 触发ECharts resize
            if (mapChart) mapChart.resize();
        }
    }

    // ==================== ECharts 中国地图 ====================
    let mapChart = null;

    function initMap() {
        mapChart = echarts.init(document.getElementById('map-chart'), null, { renderer: 'canvas' });

        // 加载本地中国GeoJSON
        fetch('data/china.json')
            .then(res => res.json())
            .then(chinaJson => {
                echarts.registerMap('china', chinaJson);
                renderMap();
                // 隐藏加载遮罩
                document.getElementById('loading-overlay').classList.add('hidden');
                document.getElementById('map-view').classList.replace('view-hidden', 'view-visible');
            })
            .catch(err => {
                console.error('地图数据加载失败:', err);
                document.querySelector('.loading-text').textContent = '地图数据加载失败，请检查网络后刷新重试';
            });
    }

    // ==================== Three.js 3D场景 ====================
    let scene, camera, renderer, gltfLoader, controls;
    let currentModel = null;
    let currentSpotInfo = null;
    let modelMissing = false;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    // 用于区分「点击」与「拖拽旋转」
    let pointerDownPos = { x: 0, y: 0 };

    function initScene() {
        const container = document.getElementById('canvas-container');

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f1525);
        scene.fog = new THREE.Fog(0x0f1525, 10, 40);

        camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 4);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 1;
        controls.maxDistance = 30;

        gltfLoader = new THREE.GLTFLoader();

        // 灯光
        scene.add(new THREE.AmbientLight(0xffffff, 0.55));
        const dl = new THREE.DirectionalLight(0xffffff, 0.85);
        dl.position.set(5, 6, 5);
        scene.add(dl);
        const bl = new THREE.DirectionalLight(0x88aaff, 0.35);
        bl.position.set(-3, -2, -3);
        scene.add(bl);

        // 地面网格，增强空间感
        const grid = new THREE.GridHelper(20, 40, 0x1c3a5e, 0x14263e);
        grid.position.y = -1.05;
        scene.add(grid);

        animate();
        window.addEventListener('resize', onWindowResize);
        renderer.domElement.addEventListener('pointerdown', function(e) {
            pointerDownPos.x = e.clientX;
            pointerDownPos.y = e.clientY;
        });
        renderer.domElement.addEventListener('click', onCanvasClick);
    }

    function animate() {
        requestAnimationFrame(animate);
        if (currentView === 'scene') {
            controls.update();
            // 占位模型缓慢自转
            if (currentModel && currentModel.userData.isPlaceholder) {
                currentModel.rotation.y += 0.005;
            }
            // 水流动画（如都江堰原理图）
            if (currentModel && currentModel.userData.flowUpdate) {
                currentModel.userData.flowUpdate(performance.now() / 1000);
            }
            renderer.render(scene, camera);
        }
    }

    function onWindowResize() {
        if (currentView !== 'scene') return;
        const container = document.getElementById('canvas-container');
        if (!container) return;
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    }

    // 射线拾取（带拖拽位移判断，避免旋转后误触发）
    function onCanvasClick(e) {
        if (!currentModel || currentView !== 'scene') return;
        const dx = e.clientX - pointerDownPos.x;
        const dy = e.clientY - pointerDownPos.y;
        if (Math.sqrt(dx * dx + dy * dy) > 6) return; // 视为拖拽，不拾取

        const container = document.getElementById('canvas-container');
        const rect = container.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(currentModel, true);
        if (intersects.length > 0 && currentSpotInfo) {
            renderInfo(currentSpotInfo, '<div class="pick-tag">&#10003; 拾取命中</div>');
        }
    }

    // 递归释放内存
    function disposeModel(obj) {
        if (!obj) return;
        obj.traverse(function(child) {
            if (child.geometry) child.geometry.dispose();
            if (child.material) {
                if (Array.isArray(child.material)) {
                    child.material.forEach(function(m) { m.dispose(); });
                } else {
                    child.material.dispose();
                }
            }
        });
    }

    // 将模型缩放到统一大小、居中，并据包围球调整相机距离
    function frameModel(model) {
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        const scale = 2 / maxDim;
        model.scale.setScalar(scale);
        model.position.sub(center.multiplyScalar(scale));

        // 根据视野角计算能完整容纳模型的相机距离
        const radius = 1.2; // 缩放后模型包围球半径约为 1，留 20% 余量
        const fov = camera.fov * Math.PI / 180;
        const dist = radius / Math.sin(fov / 2);
        camera.position.set(0, dist * 0.35, dist);
        controls.target.set(0, 0, 0);
        controls.update();
    }

    // ==================== 示意性程序化模型（低多边形风格） ====================
    // 通用材质
    function stdMat(color, opts) {
        return new THREE.MeshStandardMaterial(Object.assign({
            color: color, roughness: 0.85, metalness: 0.05, flatShading: true
        }, opts || {}));
    }
    const MAT_RED   = stdMat(0x9e2b25);            // 朱红（柱、墙）
    const MAT_ROOF  = stdMat(0x3d4b63);            // 青灰瓦
    const MAT_STONE = stdMat(0x9aa5b1);            // 石材
    const MAT_GOLD  = stdMat(0xd4af37, { metalness: 0.6, roughness: 0.35 }); // 鎏金
    const MAT_WATER = stdMat(0x2f7fbf, { transparent: true, opacity: 0.7, roughness: 0.3 });
    const MAT_WOOD  = stdMat(0x7a5230);            // 木色

    // 中式四角攒尖顶：w/d 为覆盖面宽深，h 为举高，overhang 为出檐
    function makeHipRoof(w, d, h, overhang, mat) {
        const roof = new THREE.Mesh(new THREE.ConeGeometry(1, 1, 4, 1), mat || MAT_ROOF);
        roof.rotation.y = Math.PI / 4;
        // 四棱锥底面半边距为 apothem = r*cos(45°)，据此反算缩放使出檐到位
        roof.scale.set((w / 2 + overhang) / Math.cos(Math.PI / 4), h, (d / 2 + overhang) / Math.cos(Math.PI / 4));
        return roof;
    }

    // 西湖：湖心亭 + 断桥意象

    // 都江堰：治水原理示意图（鱼嘴分水 / 飞沙堰排沙 / 宝瓶口控流）
    // 布局：z 轴负方向为上游。岷江自北向南，经鱼嘴分为外江（西）与内江（东），
    // 内江中游设飞沙堰（低堰，洪水溢流回外江），末端穿玉垒山缺口即宝瓶口。
    function buildDujiangyan() {
        const g = new THREE.Group();
        const flowTex = [];

        // 带流向纹理的水面
        function makeWaterTex() {
            const cv = document.createElement('canvas');
            cv.width = 64; cv.height = 256;
            const c = cv.getContext('2d');
            c.fillStyle = '#1f6fb8'; c.fillRect(0, 0, 64, 256);
            c.strokeStyle = 'rgba(160,220,255,0.55)'; c.lineWidth = 3;
            for (let i = 0; i < 8; i++) {
                const y = i * 32 + 6;
                c.beginPath();
                c.moveTo(4, y); c.quadraticCurveTo(32, y + 10, 60, y);
                c.stroke();
            }
            const t = new THREE.CanvasTexture(cv);
            t.wrapS = t.wrapT = THREE.RepeatWrapping;
            flowTex.push(t);
            return t;
        }
        function water(w, l, x, z, rotZ) {
            const m = new THREE.Mesh(
                new THREE.PlaneGeometry(w, l),
                new THREE.MeshStandardMaterial({ map: makeWaterTex(), transparent: true, opacity: 0.85, roughness: 0.25, metalness: 0.1 })
            );
            m.rotation.x = -Math.PI / 2;
            if (rotZ) m.rotation.z = rotZ;
            m.position.set(x, -0.82, z);
            g.add(m);
            return m;
        }
        // 文字标注牌
        function label(text, x, y, z, scale) {
            const cv = document.createElement('canvas');
            cv.width = 256; cv.height = 80;
            const c = cv.getContext('2d');
            c.fillStyle = 'rgba(8,16,26,0.78)';
            c.beginPath(); c.roundRect(0, 0, 256, 80, 14); c.fill();
            c.strokeStyle = 'rgba(120,190,255,0.8)'; c.lineWidth = 3;
            c.beginPath(); c.roundRect(3, 3, 250, 74, 12); c.stroke();
            c.fillStyle = '#eaf6ff';
            c.font = '700 42px "Microsoft YaHei", sans-serif';
            c.textAlign = 'center'; c.textBaseline = 'middle';
            c.fillText(text, 128, 42);
            const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), transparent: true }));
            const s = scale || 1;
            sp.scale.set(0.64 * s, 0.2 * s, 1);
            sp.position.set(x, y, z);
            g.add(sp);
            return sp;
        }

        const MAT_BANK = stdMat(0x4a6741);   // 岸坡植被
        const MAT_EARTH = stdMat(0x8a7a5a);  // 土滩
        const MAT_MOUNT = stdMat(0x5d6b52);  // 山体
        const MAT_DIKE = stdMat(0x76828f);   // 堤堰石料

        // 地形基座
        const base = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.3, 8.4), MAT_EARTH);
        base.position.set(0, -1.12, 0);
        g.add(base);

        // 岷江上游（未分流段）
        water(1.5, 2.2, 0, -2.55, 0);
        label('岷江', 0, 0.15, -3.35, 1.05);

        // 外江（西侧，较宽）
        water(1.6, 5.6, -1.35, 1.0, 0.06);
        label('外江 · 泄洪', -1.7, 0.05, 1.9);
        // 内江（东侧，较窄）
        water(1.0, 4.2, 0.85, 0.75, -0.04);
        label('内江 · 灌溉', 1.05, 0.05, 0.2);

        // 鱼嘴分水堤（梭形堤体 + 尖端）
        const dike = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 10), MAT_DIKE);
        dike.scale.set(0.34, 0.24, 1.15);
        dike.position.set(0, -0.72, -1.15);
        g.add(dike);
        const tip = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.6, 10), MAT_DIKE);
        tip.rotation.x = -Math.PI / 2;
        tip.position.set(0, -0.72, -2.28);
        g.add(tip);
        label('鱼嘴 · 四六分水', 0, 0.25, -1.35, 1.1);

        // 金刚堤（分水堤向下游延伸，隔开内外江）
        const dike2 = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.34, 2.1), MAT_DIKE);
        dike2.position.set(0.02, -0.72, 0.3);
        g.add(dike2);

        // 飞沙堰（低堰：内江水大可漫过堰顶流回外江）
        const weir = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.14, 0.8), stdMat(0x97a3ad));
        weir.position.set(0.0, -0.82, 1.55);
        g.add(weir);
        // 堰顶溢流水面
        water(0.5, 0.8, 0.0, 1.55, 0);
        label('飞沙堰 · 二八分沙', -0.55, 0.1, 1.6, 1.05);

        // 内江末段收窄，流向宝瓶口
        water(0.85, 1.6, 0.95, 2.6, 0);

        // 玉垒山（东侧山脊，中部缺口即宝瓶口）
        const m1 = new THREE.Mesh(new THREE.ConeGeometry(0.9, 1.5, 8), MAT_MOUNT);
        m1.scale.set(1.1, 1, 1.6);
        m1.position.set(2.0, -0.35, 1.75);
        g.add(m1);
        const m2 = new THREE.Mesh(new THREE.ConeGeometry(0.85, 1.3, 8), MAT_MOUNT);
        m2.scale.set(1.05, 1, 1.5);
        m2.position.set(2.05, -0.42, 3.15);
        g.add(m2);
        label('玉垒山', 2.15, 0.75, 1.75);
        // 宝瓶口：山体缺口中的狭窄引水通道（+x 方向穿山东去）
        water(0.9, 0.62, 1.95, 2.45, Math.PI / 2);
        // 离堆（宝瓶口内侧孤丘）
        const lidui = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.55, 8), MAT_MOUNT);
        lidui.position.set(1.28, -0.6, 2.45);
        g.add(lidui);
        label('宝瓶口 · 控流', 1.9, 0.35, 2.45, 1.05);

        // 两岸
        const bankW = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.35, 7.6), MAT_BANK);
        bankW.position.set(-2.6, -0.95, 0.2);
        g.add(bankW);
        const bankE = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 3.6), MAT_BANK);
        bankE.position.set(1.45, -0.97, -0.7);
        g.add(bankE);

        // 安澜索桥：横跨内外两江
        const MAT_WOOD2 = stdMat(0x6b4f35);
        const bridge = new THREE.Group();
        [-2.05, -0.45, 1.35].forEach(function(x) {
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.06, 0.9, 6), MAT_WOOD2);
            leg.position.set(x, -0.4, 0);
            bridge.add(leg);
        });
        const deck = new THREE.Mesh(new THREE.BoxGeometry(4.1, 0.05, 0.34), stdMat(0xa9825a));
        deck.position.y = 0.06;
        bridge.add(deck);
        [-0.14, 0.14].forEach(function(z) {
            const curve = new THREE.QuadraticBezierCurve3(
                new THREE.Vector3(-2.05, 0.12, z),
                new THREE.Vector3(-0.3, -0.12, z),
                new THREE.Vector3(1.35, 0.12, z)
            );
            bridge.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 24, 0.018, 6), stdMat(0x333333)));
        });
        bridge.position.set(-0.15, -0.55, -0.35);
        g.add(bridge);
        label('安澜索桥', -1.15, 0.35, -0.5, 0.95);

        // 水流动画挂钩
        g.userData.flowUpdate = function(t) {
            flowTex.forEach(function(tx) { tx.offset.y = -t * 0.35; });
        };
        return g;
    }

    // 武侯祠：祠堂门殿 + 红墙 + 石狮意象
    function buildWuhouci() {

        // 脊端鸱吻
        [-0.55, 0.55].forEach(function(x) {
            const chiwen = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.16, 0.1), MAT_GOLD);
            chiwen.position.set(x, 0.62, 0);
            g.add(chiwen);
        });

        // 门额牌匾
        const plaque = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.22, 0.05), stdMat(0x1a1a2e));
        plaque.position.set(0, 0.02, 0.6);
        g.add(plaque);
        const plaqueFrame = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.28, 0.03), MAT_GOLD);
        plaqueFrame.position.set(0, 0.02, 0.58);
        g.add(plaqueFrame);

        // 两侧红墙
        [-1.35, 1.35].forEach(function(x) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.5, 0.12), MAT_RED);
            wall.position.set(x, -0.57, 0.35);
            g.add(wall);
            const coping = new THREE.Mesh(new THREE.BoxGeometry(1.16, 0.08, 0.2), MAT_ROOF);
            coping.position.set(x, -0.29, 0.35);
            g.add(coping);
        });

        // 门前石狮一对（意象）
        [-0.55, 0.55].forEach(function(x) {
            const lion = new THREE.Group();
            const pedestal = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 0.24), MAT_STONE);
            pedestal.position.y = 0.05;
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.18, 0.2), MAT_STONE);
            body.position.y = 0.19;
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), MAT_STONE);
            head.position.set(0, 0.32, 0.06);
            lion.add(pedestal, body, head);
            lion.position.set(x, -0.82, 0.85);
            g.add(lion);
        });
        return g;
    }


    // 武侯祠门匾：黑底金字「武侯祠」（传统从右至左书写）
    // 挂载为模型子节点，坐标使用模型局部坐标系
    function addWuhouciPlaque(model) {
        const cv = document.createElement('canvas');
        cv.width = 1024; cv.height = 256;
        const ctx = cv.getContext('2d');
        // 黑底（略带木质深棕黑，贴近真实匾漆）
        ctx.fillStyle = '#141210';
        ctx.fillRect(0, 0, 1024, 256);
        // 金色边框
        ctx.strokeStyle = '#C9A84C';
        ctx.lineWidth = 10;
        ctx.strokeRect(14, 14, 996, 228);
        // 金色大字，从右至左：武 侯 祠
        ctx.fillStyle = '#D8B45A';
        ctx.font = '700 150px KaiTi, STKaiti, "楷体", serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 6;
        const chars = ['武', '侯', '祠'];
        const xs = [810, 512, 214];
        for (let i = 0; i < 3; i++) ctx.fillText(chars[i], xs[i], 134);
        const tex = new THREE.CanvasTexture(cv);
        tex.anisotropy = 4;
        const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: false });
        // 模型局部坐标：x 0.1785(+x面表层), y 0.4125, z 0；宽0.15 高0.0375
        const plaque = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 0.0375), mat);
        plaque.position.set(0.1785, 0.4125, 0);
        plaque.rotation.y = Math.PI / 2; // 面向 +x
        model.add(plaque);
    }

    // 模型文件版本号：更新 GLB 后递增，避免浏览器缓存旧模型
    const MODEL_V = '20261005c';

    // 加载模型
    function loadModel(spot) {
        console.log('加载模型:', spot.model, spot.name);
        currentSpotInfo = spot;
        modelMissing = false;

        if (currentModel) {
            scene.remove(currentModel);
            disposeModel(currentModel);
            currentModel = null;
        }

        const loadingEl = document.getElementById('model-loading');
        loadingEl.style.display = 'flex';

        // 配置了程序化构建函数且未切换到真实模型的景点，使用示意模型
        if (typeof spot.builder === 'function' && spot.useBuilder !== false) {
            loadingEl.style.display = 'none';
            currentModel = spot.builder();
            scene.add(currentModel);
            frameModel(currentModel);
            console.log('示意模型构建完成:', spot.name);
            return;
        }

        gltfLoader.load(
            spot.model + (spot.model.includes('?') ? '&' : '?') + 'v=' + MODEL_V,
            function(gltf) {
                loadingEl.style.display = 'none';
                const model = gltf.scene;
                scene.add(model);
                currentModel = model;
                if (spot.name === '武侯祠') addWuhouciPlaque(model);
                frameModel(model);
                console.log('模型加载完成:', spot.name);
            },
            function(xhr) {
                if (xhr.total) {
                    console.log('加载进度:', Math.round(xhr.loaded / xhr.total * 100) + '%');
                }
            },
            function(err) {
                loadingEl.style.display = 'none';
                console.warn('模型加载失败，使用占位模型:', spot.model, err);
                modelMissing = true;
                currentModel = buildPlaceholder();
                scene.add(currentModel);
                frameModel(currentModel);
                // 在信息面板提示模型缺失
                renderInfo(spot, null);
            }
        );
    }

    // ==================== 初始化 ====================
    window.addEventListener('load', function() {
        // 地图初始化独立容错，3D 场景等插件脚本就绪后再初始化
        try { initMap(); } catch (e) { console.error('地图初始化失败:', e); }
        (function waitPlugins(retry) {
            if (window.__threePluginsReady) {
                try { initScene(); } catch (e) { console.error('3D场景初始化失败:', e); }
            } else if (retry > 0) {
                setTimeout(function() { waitPlugins(retry - 1); }, 200);
            } else {
                console.error('Three.js 插件加载超时，3D 功能不可用');
            }
        })(50); // 最多等待 10 秒
    });
    </script>
